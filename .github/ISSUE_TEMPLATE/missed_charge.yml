name: Missed or wrong detection
description: A bank SMS or email that subwatch read wrongly or ignored.
labels: [parser]
body:
  - type: markdown
    attributes:
      value: |
        Real message formats are how subwatch gets better, thank you.
        **Anonymise first:** replace account/card digits, UPI IDs, names, phone numbers,
        reference numbers and email addresses with `XXXX`. Keep the bank's wording,
        the merchant name and the amount format exactly as they were.
  - type: dropdown
    id: source
    attributes:
      label: Source
      options: [Bank SMS, Email]
    validations:
      required: true
  - type: input
    id: bank
    attributes:
      label: Bank or sender
      placeholder: e.g. HDFC Bank, ICICI credit card, Spotify receipt email
  - type: textarea
    id: message
    attributes:
      label: The anonymised message
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should subwatch have found?
      placeholder: e.g. a ₹119 monthly charge from Spotify
    validations:
      required: true
